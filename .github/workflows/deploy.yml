name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Tracks zip is too large for git (127MB > 100MB limit); it lives as a
      # release asset and gets baked into the published site at deploy time.
      - name: Fetch tracks zip from release
        run: curl --fail -L -o dist/Cameron-Brooks-Tracks.zip https://github.com/brookcs3/vantablob/releases/download/tracks-2026-07/Cameron-Brooks-Tracks.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
